# Render Free Web Service Deployment Blueprint
# High-availability backend deployment configuration for FastAPI service
services:
  - type: web
    name: ntro-fire-detection-api
    env: python
    region: singapore # Closest low-latency region to India
    plan: free
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "uvicorn api.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: FIRMS_MAP_KEY
        sync: false
      - key: TARGET_REGION
        value: gujarat
      - key: TARGET_BBOX
        value: "68.0,20.0,78.0,26.0"
      - key: MODEL_PATH
        value: ml/models/model.pkl
      - key: ENCODER_PATH
        value: ml/models/encoder.pkl
